name: E2E smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Read-only smoke target (preview or https://www.safewaycouriers.com)
        required: true
        default: https://www.safewaycouriers.com
        type: string
  schedule:
    - cron: "17 13 * * *"
  pull_request:
    branches: [main]

concurrency:
  group: e2e-smoke-${{ github.event.inputs.base_url || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    if: ${{ github.event_name == 'workflow_dispatch' || secrets.PLAYWRIGHT_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || secrets.PLAYWRIGHT_BASE_URL }}
      SKIP_WEBSERVER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require smoke URL
        run: |
          if [ -z "$PLAYWRIGHT_BASE_URL" ]; then
            echo "PLAYWRIGHT_BASE_URL is required (workflow_dispatch input or repo secret)."
            exit 1
          fi
          echo "Smoke target: $PLAYWRIGHT_BASE_URL"
          echo "This job is read-only. It does not log in or submit forms."

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
