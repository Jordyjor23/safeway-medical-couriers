name: Security dependency refresh

on:
  push:
    branches: [chore/security-deps-2026-10-02]
    paths:
      - .github/workflows/security-dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/security-deps-2026-10-02

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Upgrade patched Next.js dependencies
        run: npm install next@16.3.8 eslint-config-next@16.3.8 --save-exact

      - name: Apply non-breaking production audit fixes
        run: npm audit fix --omit=dev --omit=optional

      - name: Verify clean install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Show resolved versions
        run: npm ls next eslint-config-next undici --all || true

      - name: Commit refreshed dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "Upgrade patched Next.js and transitive dependencies"
          git push origin HEAD:chore/security-deps-2026-10-02
