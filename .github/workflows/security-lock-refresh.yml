name: Security lock refresh

on:
  push:
    branches:
      - stabilize/safeway-core-workflows

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stabilize/safeway-core-workflows

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh patched framework dependencies
        run: |
          npm install --save-exact next@16.3.5
          npm install --save-dev --save-exact eslint-config-next@16.3.5

      - name: Commit lock refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "safeway-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: patch Next.js security advisories [lock-refresh]"
          git push origin HEAD:stabilize/safeway-core-workflows
