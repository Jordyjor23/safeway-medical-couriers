name: Prisma deepmerge override verification

on:
  push:
    branches: [chore/prisma-deepmerge-audit-2026-10-02]
    paths:
      - .github/workflows/prisma-deepmerge-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-validation-123456
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/prisma-deepmerge-audit-2026-10-02

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile with override
        run: npm install

      - name: Verify resolved dependency tree
        run: npm ls deepmerge-ts @prisma/config prisma @prisma/client --all

      - name: Full dependency audit
        run: npm audit --audit-level=high

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "Apply deepmerge-ts security override"
          git push origin HEAD:chore/prisma-deepmerge-audit-2026-10-02
